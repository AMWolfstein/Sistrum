name: sistrum
description: Sistrum, extension-driven music metadata and downloads for mobile devices
publish_to: "none"
version: 5.4.0+169

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State Management
  flutter_riverpod: ^3.5.0

  # Navigation
  go_router: ^18.1.3

# Storage & Persistence
  shared_preferences: ^2.5.6
  # v11 removes legacy Android readers, breaking users who skip the v10 migration.
  # Keep the compatibility release until old encrypted installs can be migrated.
  flutter_secure_storage: 10.3.4
  path_provider: ^2.1.6
  # Windows known-folder lookup for the default desktop Music folder.
  path_provider_windows: ^2.3.0
  path: ^1.9.1
  # Desktop backend library bindings (lib/services/backend).
  ffi: ^2.2.0
  sqflite: ^2.4.5
  # Windows and Linux have no sqflite plugin; they use FFI with bundled SQLite.
  sqflite_common_ffi: ^2.4.5

  crypto: ^3.0.8

  # Streaming backup archives
  archive: ^4.6.0

  # UI Components
  liquid_glass_easy: 5.2.0
  cupertino_icons: ^2.0.0
  volume_controller: ^3.7.1

  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  material_color_utilities: 0.13.0

  # Permissions
  permission_handler: ^13.0.2

  # File Picker
  file_picker: ^13.3.2
  # Desktop: drop music files and folders onto the window to add them.
  # 0.9 needs cross_file 0.4; file_picker and share_plus still require 0.3.
  desktop_drop: 0.8.4

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  receive_sharing_intent: ^1.9.0
  logger: ^2.8.0

  # FFmpeg for audio conversion
  ffmpeg_kit_flutter_new_audio: 2.5.8

  video_player: ^2.14.1

  xml: ^7.1.0

  # Notifications
  flutter_local_notifications: ^23.0.0
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4
  # libmpv playback where available, and nothing else.
  media_kit: ^1.2.6
  # Desktop media sessions behind audio_service: MPRIS on Linux (D-Bus) and
  # the System Media Transport Controls on Windows.
  audio_service_platform_interface: ^0.1.3
  dbus: ^0.7.15
  smtc_windows: ^1.1.0

dependency_overrides:
  # Retain the existing Apple keychain fixes while Android uses legacy migration.
  # The v10 and v11 Apple option maps use the same platform interface contract.
  flutter_secure_storage_darwin: 0.4.3
  # Preserve Android proxy descriptors supplied by network document providers.
  audioplayers_android:
    path: third_party/audioplayers_android
  # smtc_windows 1.1.0 is generated by and links flutter_rust_bridge =2.11.1,
  # but allows any 2.x runtime; a newer one fails its version check at start
  # and leaves Windows without media transport controls.
  flutter_rust_bridge: 2.11.1
  # Builds the Linux plugin without its native bundle where upstream has
  # none (arm64); desktop runs the bundled ffmpeg CLI instead.
  ffmpeg_kit_flutter_new_audio:
    path: third_party/ffmpeg_kit_flutter_new_audio

hooks:
  user_defines:
    sqlite3:
      # Android keeps the sqflite plugins, so it bundles no copy.
      source:
        android: system
        default: sqlite3

dev_dependencies:
  flutter_cache_manager: ^3.5.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  clock: 1.1.3
  analyzer: ^14.7.0
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_lint: ^3.2.0
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: 2.1.3
  video_player_platform_interface: 6.9.0

flutter_launcher_icons:
  android: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#12100E"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "icon_monochrome_android.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - LICENSE
    - COPYING
    - NOTICE
    - assets/images/
    - assets/images/sistrum-horizontal-white.png
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt
    - assets/licenses/flac.txt
    - assets/licenses/ffmpeg.txt
    - assets/licenses/lgpl-3.0.txt
    - assets/licenses/native_palette.txt
    - assets/licenses/native_data_jobs.txt
    - assets/licenses/romanization.txt
    - assets/romanization/pinyin.txt.gz

